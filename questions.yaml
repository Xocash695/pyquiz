# Every option is quoted on purpose. Unquoted values like no, null or [1, 2, 3]
# would be parsed by YAML as a bool, None or a list instead of a string.

- id: 1
  topic: git
  code: |
    # You edited app.py but have not run git add yet.
    # Which command shows exactly which lines changed?
  options:
    - "git log app.py"
    - "git status app.py"
    - "git diff app.py"
    - "git blame app.py"
  answer: C
  why: "git diff shows the unstaged line changes. status lists file states only, log lists commits, blame shows who last changed each line."

- id: 2
  topic: exceptions
  code: |
    try:
        int("x")
    except ValueError:
        print("a")
    else:
        print("b")
    finally:
        print("c")
  options:
    - "a, then c"
    - "a, then b, then c"
    - "a only"
    - "b, then c"
  answer: A
  why: "int('x') raises ValueError, so except runs and else is skipped. finally always runs."

- id: 3
  topic: mutation
  code: |
    def add(lst):
        lst = lst + [4]

    a = [1, 2, 3]
    add(a)
    print(a)
  options:
    - "[1, 2, 3, 4]"
    - "[1, 2, 3]"
    - "[4]"
    - "None"
  answer: B
  why: "lst + [4] builds a new list and rebinds the local name, so the caller's list is untouched. lst.append(4) would have changed it."

- id: 4
  topic: json
  code: |
    import json
    print(json.dumps({"x": (1, 2), 5: None}))
  options:
    - '{"x": (1, 2), 5: None}'
    - '{"x": [1, 2], 5: null}'
    - '{"x": "(1, 2)", "5": "None"}'
    - '{"x": [1, 2], "5": null}'
  answer: D
  why: "Tuples become arrays, None becomes null, and JSON object keys are always strings."

- id: 5
  topic: requests
  code: |
    # The server answers 500 within one second.
    # The body is the JSON text {"error": "boom"}.
    r = requests.get(url, timeout=5)
    print(r.json()["error"])
  options:
    - "HTTPError is raised by get()"
    - "boom"
    - "Timeout is raised by get()"
    - "KeyError"
  answer: B
  why: "requests does not raise on 5xx unless you call raise_for_status(). The server answered in time and the body is valid JSON, so this prints boom."
